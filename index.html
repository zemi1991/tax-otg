<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tax OTG</title><meta name="theme-color" content="#0e9f8a">
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#e6f4f1;font:600 16px system-ui,sans-serif;color:#0b6e69}a{color:#0a7f86}</style>
</head><body>
<p>Opening Tax OTG… <a href="app/">Tap here if nothing happens</a></p>
<script>
  // The app moved to /tax-otg/app/. Remove the old service worker at this level, then go there.
  (async () => {
    try {
      if ('serviceWorker' in navigator) {
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.filter(r => !r.scope.includes('/app/')).map(r => r.unregister()));
      }
      if (window.caches) { const keys = await caches.keys(); await Promise.all(keys.filter(k => !k.startsWith('tax-otg-app')).map(k => caches.delete(k))); }
    } catch (e) {}
    location.replace('app/' + location.hash);   // keep any sign-in link token in the #hash
  })();
</script>
</body></html>
